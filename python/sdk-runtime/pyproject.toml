[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "danke-harness-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled dsh CLI runtime for the Danke Harness Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]

[project.urls]
Homepage = "https://github.com/DanKE123abc/danke-harness"
Documentation = "https://github.com/DanKE123abc/danke-harness/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/DanKE123abc/danke-harness/issues"
Source = "https://github.com/DanKE123abc/danke-harness"

[project.scripts]
dsh = "danke_harness_runtime:main"

# Include the injected dsh executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = [
  "src/danke_harness_runtime/runtime/danke-harness-sdk-runtime-*",
  "src/danke_harness_runtime/runtime/danke-harness-sdk-runtime-*/**",
  "src/danke_harness_runtime/runtime/linux-*/**",
  "src/danke_harness_runtime/runtime/macos-*/**",
  "src/danke_harness_runtime/runtime/win-*/**",
]
exclude = ["src/danke_harness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/danke_harness_runtime"]
# The release job uses Twine 6.2.0, which accepts core metadata through 2.4.
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
